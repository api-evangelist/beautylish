aid: beautylish
name: Beautylish
description: 'Beautylish is a San Francisco based online beauty retailer and community,
  founded in 2010 by Nils Johnson, Vu Nguyen and Sameer Iyengar. It began as a community
  where beauty enthusiasts shared tutorials, reviews and product knowledge, and launched
  its own e-commerce storefront in 2012. Beautylish curates makeup, skincare, hair,
  fragrance, nails, bath and body, wellness and tool brands from around the world,
  pairs them with editorial content and makeup-artist guidance, and operates its own
  fulfillment, rewards (Beautylish Rewards), flexible payments and Zero Day Delivery
  programs. The company runs a first-party storefront rather than a developer platform:
  as of this profile it publishes no developer portal, no public API reference, no
  OpenAPI or other machine-readable contract, and no SDKs. Its public partner surface
  is a ShareASale/Awin affiliate program rather than an API.'
